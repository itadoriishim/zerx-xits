<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — ZERX XIT</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="admin-login-body">
    <div class="admin-login-card">
        <div class="login-logo">ZERX <span class="logo-accent">ADMIN</span></div>
        <p class="login-subtitle">Secure Admin Access</p>

        <form class="login-form" id="loginForm">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" class="form-input" id="username" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-input" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-full btn-glow">
                <span class="btn-icon">🔐</span> LOGIN
            </button>
        </form>

        <p class="login-back"><a href="/">← Back to ZERX XIT</a></p>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
    function showToast(msg, type='info') {
        const c = document.getElementById('toastContainer');
        const t = document.createElement('div');
        t.className = `toast ${type}`;
        t.textContent = msg;
        c.appendChild(t);
        setTimeout(() => t.remove(), 3500);
    }

    async function api(endpoint, options={}) {
        const res = await fetch(endpoint, {
            headers: {'Content-Type': 'application/json', ...options.headers},
            ...options
        });
        return await res.json();
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        const res = await api('/api/admin/login', {
            method: 'POST',
            body: JSON.stringify({ username, password })
        });

        if (res.success) {
            showToast('Login successful!', 'success');
            setTimeout(() => window.location.href = '/admin-dashboard', 1000);
        } else {
            showToast(res.error || 'Invalid credentials', 'error');
        }
    });
    </script>
</body>
</html>
